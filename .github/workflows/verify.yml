name: Verify services
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        pom: [pom.xml, payment-service/pom.xml, inventory-service/pom.xml]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: sh mvnw -B -f ${{ matrix.pom }} verify
  integration:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package applications
        run: |
          sh mvnw -B -DskipTests package
          sh mvnw -B -f payment-service/pom.xml -DskipTests package
          sh mvnw -B -f inventory-service/pom.xml -DskipTests package
      - run: docker compose up -d --wait --wait-timeout 180
      - run: bash scripts/smoke-test.sh
      - name: Collect diagnostics
        if: always()
        run: docker compose logs > target/compose.log
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-logs
          path: |
            target/smoke/
            target/compose.log
      - name: Stop infrastructure
        if: always()
        run: docker compose down
